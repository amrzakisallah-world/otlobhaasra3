<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>لوحة التحكم</title>
<style>
:root{--bg:#eef2f1;--sf:#fff;--ink:#14201e;--mut:#5f706d;--ac:#0f766e;--ac2:#fff;--ln:#d3dcda;--warn:#b45309;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--sf:#172120;--ink:#e6efed;--mut:#93a6a2;--ac:#2dd4bf;--ac2:#06201d;--ln:#2a3a38;--warn:#f59e0b;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;padding-bottom:90px}
h1{font-size:19px;margin:0;padding:10px 14px 6px}
.tabs{display:flex;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--ln);z-index:5}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:inherit;font-weight:600;padding:10px 2px}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
main{padding:12px 14px;max-width:720px;margin:auto}
.big{background:var(--ac);color:var(--ac2);border-radius:14px;padding:16px}.big b{display:block;font-size:32px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.box,.it{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:11px;margin-bottom:8px}
.box small,.m{color:var(--mut);font-size:13px}.box b{display:block;font-size:19px}
.m{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
h2{font-size:14px;color:var(--mut);margin:16px 0 6px}
input{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px;width:90px;text-align:center}
input.w{width:100%;text-align:right}
button.b{background:var(--ac);color:var(--ac2);border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:700}
button.b.x{background:none;color:var(--bad);border:1px solid var(--ln)}
.low{color:var(--warn);font-weight:700}.zero,.err{color:var(--bad);font-weight:700}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}.foot span{flex:1}
a{color:var(--ac)}.det{line-height:1.8;margin-top:8px;border-top:1px dashed var(--ln);padding-top:8px}
</style></head><body><div id="app"></div>
<script>
var PW=localStorage.getItem("pw")||"",C=null,O=[],tab="home",dirty=false,msg="";
var G={shaan:"شان",sero:"سيروبايب",kids:"سوبركيدز"},ST={new:"جديد",confirmed:"مؤكد",delivered:"اتسلّم",cancelled:"ملغي"};
var $=function(i){return document.getElementById(i)},f=function(n){return Math.round(n).toLocaleString("en-US")};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cost(i){return Math.round(C.items[i].l*(1-C.disc/100))}
async function api(p,b){var r=await fetch("/api/admin/"+p,{method:b?"POST":"GET",headers:{"x-admin":PW,"content-type":"application/json"},body:b?JSON.stringify(b):undefined});
if(r.status===401){PW="";localStorage.removeItem("pw");login(PW===""&&msg?"كلمة السر غلط":"");throw 0}
var j=await r.json();if(!r.ok)throw j;return j}
function login(e){$("app").innerHTML='<main><h1>🔒 لوحة التحكم</h1><div class="box"><input class="w" type="password" id="pw" placeholder="كلمة السر"><p class="err">'+(e||"")+'</p><button class="b" id="go">دخول</button></div></main>';
$("go").onclick=function(){PW=$("pw").value;msg="x";localStorage.setItem("pw",PW);load()}}
async function load(){try{var d=await api("data");C=d.cfg;O=d.orders.sort(function(a,b){return b.t-a.t});dirty=false;render()}catch(e){if(e)$("app").innerHTML='<main class="err">تعذّر التحميل: '+esc(e.e||e)+'</main>'}}
function render(){var T=[["home","الملخص"],["orders","الطلبات"],["stock","المخزون"],["set","الإعدادات"]];
var h='<h1>لوحة التحكم</h1><div class="tabs">'+T.map(function(t){var n=t[0]==="orders"?O.filter(function(o){return o.s==="new"}).length:0;return'<button data-t="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+(n?" ("+n+")":"")+'</button>'}).join("")+'</div><main>'+({home:home,orders:orders,stock:stock,set:sett}[tab])()+'</main>';
if(tab==="stock"||tab==="set")h+='<div class="foot"><span id="ds">'+(dirty?"فيه تعديلات لسه ما اتحفظتش":"")+'</span><button class="b" id="save">احفظ</button></div>';
$("app").innerHTML=h}
function home(){var rev=0,cs=0,n={new:0,confirmed:0,delivered:0,cancelled:0},sv=0;
O.forEach(function(o){n[o.s]++;if(o.s==="confirmed"||o.s==="delivered"){rev+=o.tot;cs+=o.cost||0}});
C.items.forEach(function(i,k){sv+=i.q*cost(k)});var H=C.hist||{rev:0,cost:0,n:0};rev+=H.rev;cs+=H.cost;
var h='<div class="big"><small>صافي الربح (طلبات مؤكدة ومتسلّمة)</small><b>'+f(rev-cs)+' ج</b><small>مبيعات '+f(rev)+' ج − تكلفة '+f(cs)+' ج</small></div>';
h+='<div class="g2"><div class="box"><small>طلبات جديدة</small><b>'+n.new+'</b></div><div class="box"><small>مؤكدة / متسلّمة</small><b>'+n.confirmed+" / "+n.delivered+'</b></div><div class="box"><small>قيمة المخزون بسعر الشراء</small><b>'+f(sv)+' ج</b></div><div class="box"><small>ملغية</small><b>'+n.cancelled+'</b></div></div><h2>قربت تخلص</h2>';
var lo=C.items.filter(function(i){return i.q<=5});
return h+(lo.length?lo.map(function(i){return'<div class="it">'+esc(i.n)+' <span class="'+(i.q?"low":"zero")+'">'+(i.q?"باقي "+i.q:"خلص")+'</span></div>'}).join(""):'<div class="box">مفيش</div>')+'<p class="m">ملحوظة: الشحن مش داخل في الربح.'+(H.n?' شامل '+H.n+' طلب قديم اتمسح من القايمة ('+f(H.rev)+' ج مبيعات).':'')+'</p>'}
function orders(){if(!O.length)return'<div class="box">لسه مفيش طلبات.</div>';
var nd=O.filter(function(o){return o.s==="delivered"||o.s==="cancelled"}).length;return(nd?'<button class="b x" data-bulk="1">مسح المتسلّمة والملغية ('+nd+')</button>':"")+O.map(function(o,x){var bt="";
if(o.s==="new")bt='<button class="b" data-s="confirmed" data-i="'+x+'">تأكيد</button> <button class="b x" data-s="cancelled" data-i="'+x+'">إلغاء</button>';
else if(o.s==="confirmed")bt='<button class="b" data-s="delivered" data-i="'+x+'">اتسلّم</button> <button class="b x" data-s="cancelled" data-i="'+x+'">إلغاء</button>';
else if(o.s==="delivered")bt='<button class="b x" data-s="cancelled" data-i="'+x+'">إلغاء (يرجّع الستوك)</button>';
else if(o.s==="cancelled")bt='<button class="b x" data-s="new" data-i="'+x+'">رجّعه جديد</button>';
return'<div class="it"><b>'+esc(o.n)+'</b> · '+f(o.tot)+' ج · '+ST[o.s]+'<div class="m"><span>'+new Date(o.t).toLocaleString("ar-EG")+' · '+esc(o.id)+'</span><button class="b x" data-d="'+x+'">تفاصيل</button></div><div class="m">'+bt+'</div><div id="d'+x+'"></div></div>'}).join("")}
function stock(){return'<p class="m">عدّل الكمية الحالية، وبعدين اضغط «احفظ». الكمية بتنزل لوحدها لما تأكّد طلب.</p>'+C.items.map(function(i,k){return'<div class="it">'+esc(i.n)+' <small class="m">'+G[i.b]+'</small><div class="m"><span>سعر الشراء '+f(cost(k))+' ج</span><label>الكمية <input type="number" min="0" data-q="'+k+'" value="'+i.q+'"></label></div></div>'}).join("")}
function sett(){return'<div class="box"><small>خصم التاجر عن سعر القايمة % (بيحدد سعر الشراء)</small><input type="number" id="dc" value="'+C.disc+'"></div><div class="box"><small>اسم المحل (بيظهر على الفاتورة)</small><input class="w" id="sh" value="'+esc(C.shop||"")+'"></div><div class="box"><small>رقم واتساب (بصيغة 20115...)</small><input class="w" id="wa" value="'+esc(C.wa)+'"></div><div class="box"><small>التوصيل (قريبة / متوسطة / بعيدة)</small><div class="m"><input type="number" data-f="0" value="'+C.fees[0]+'"><input type="number" data-f="1" value="'+C.fees[1]+'"><input type="number" data-f="2" value="'+C.fees[2]+'"></div></div><h2>أسعار القايمة (اللي العميل بيشوفها قبل الخصم)</h2>'+C.items.map(function(i,k){return'<div class="it"><div class="m"><span>'+esc(i.n)+'</span><input type="number" min="0" data-l="'+k+'" value="'+i.l+'"></div></div>'}).join("")+'<p class="m">شرائح الخصم (20/25/30%) مكتوبة في كود الصفحة، مش هنا.</p>'}
/* مسح طلبات: بنبعت 20 في المرة عشان حد الطلبات على كلودفلير المجاني */
async function del(ks){for(var i=0;i<ks.length;i+=20)await api("delete",{ks:ks.slice(i,i+20)});await load()}
function f2(n){return(Math.round(n*100)/100).toLocaleString("en-US")}
/* الفاتورة: صفحة قابلة للطباعة أو الحفظ PDF. مفيهاش سعر الشراء ولا الربح */
async function inv(x){var w=window.open("","_blank");
try{var o=await api("order?k="+encodeURIComponent(O[x].k)),L=o.items.reduce(function(t,l){return t+l[1]*l[2]},0),X=(o.extra||[]).reduce(function(t,e){return t+e.q*e.p},0),d=o.disc!=null?o.disc:(L?Math.round((1-(o.total-X)/L)*100):0),q=o.items.reduce(function(t,l){return t+l[1]},0)+(o.extra||[]).reduce(function(t,e){return t+e.q},0);
var rows=o.items.map(function(l,n){return"<tr><td>"+(n+1)+"</td><td>"+esc(C.items[l[0]].n)+"<br><small>"+G[C.items[l[0]].b]+"</small></td><td>"+l[1]+"</td><td>"+f2(l[2]*(1-d/100))+"</td><td>"+f2(l[1]*l[2]*(1-d/100))+"</td></tr>"}).join("")+(o.extra||[]).map(function(e,n){return"<tr><td>"+(o.items.length+n+1)+"</td><td>"+esc(e.n)+(e.b?"<br><small>"+esc(e.b)+"</small>":"")+"</td><td>"+e.q+"</td><td>"+f2(e.nd?e.p:e.p*(1-d/100))+"</td><td>"+f2(e.q*(e.nd?e.p:e.p*(1-d/100)))+"</td></tr>"}).join("");
w.document.write('<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاتورة '+esc(o.id)+'</title><style>body{font-family:system-ui,Tahoma,sans-serif;color:#111;margin:0;padding:18px;max-width:800px;margin:auto}h1{margin:0;font-size:24px}.top{display:flex;justify-content:space-between;border-bottom:3px solid #0f766e;padding-bottom:10px}.c{margin:14px 0;line-height:1.9;font-size:14px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#0f766e;color:#fff}th,td{border:1px solid #ccc;padding:6px;text-align:center}td:nth-child(2){text-align:right}.t{margin-top:12px;margin-right:auto;width:260px;font-size:14px}.t div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee}.g{font-weight:700;font-size:17px;border-top:2px solid #111!important}.np{margin:16px 0;padding:10px 16px;font:inherit;background:#0f766e;color:#fff;border:0;border-radius:8px}.np2{display:inline-block;margin:0 12px}@media print{.np,.np2{display:none}}</style></head><body><button class="np" onclick="print()">طباعة / حفظ PDF</button><label class="np2"><input type="checkbox" checked onchange="fee(this)"> إظهار التوصيل</label><script>function fee(c){var g=document.getElementById("gt");document.getElementById("fr").style.display=c.checked?"flex":"none";g.textContent=c.checked?g.dataset.a:g.dataset.b}<\/script><div class="top"><div><h1>'+esc(C.shop||"فاتورة")+'</h1><div>فاتورة رقم: '+esc(o.id)+'</div></div><div style="text-align:left">التاريخ: '+new Date(o.t).toLocaleDateString("ar-EG")+(C.wa?'<br>واتساب: '+esc(C.wa):'')+'</div></div><div class="c"><b>العميل:</b> '+esc(o.name)+'<br><b>الموبايل:</b> '+esc(o.phone)+'<br><b>العنوان:</b> '+esc(o.addr)+(o.note?'<br><b>ملاحظات:</b> '+esc(o.note):'')+'</div><table><tr><th>#</th><th>الصنف</th><th>الكمية</th><th>سعر القطعة</th><th>الإجمالي</th></tr>'+rows+'</table><div class="t"><div><span>عدد القطع</span><span>'+q+'</span></div><div><span>المجموع</span><span>'+f2(o.total)+' ج</span></div><div id="fr"><span>التوصيل</span><span>'+f2(o.fee)+' ج</span></div><div class="g"><span>الإجمالي المطلوب</span><span id="gt" data-a="'+f2(o.total+o.fee)+' ج" data-b="'+f2(o.total)+' ج">'+f2(o.total+o.fee)+' ج</span></div></div></body></html>');w.document.close()}
catch(e){w.close();throw e}}
/* كارت إضافة صنف للطلب: من أصنافك (بينزّل من الستوك لو الطلب مؤكد) أو صنف جديد (بيظهر في الفاتورة بس) */
var AX=-1;
async function reopen(k){await load();var nx=O.findIndex(function(o){return o.k===k});if(nx>=0)await det(nx)}
function fill(){var q=$("aq").value.trim();$("as").innerHTML=C.items.map(function(i,k){return[k,i]}).filter(function(a){return!q||(a[1].n+" "+G[a[1].b]).indexOf(q)>-1}).map(function(a){return'<option value="'+a[0]+'">'+esc(a[1].n)+" — "+G[a[1].b]+" (باقي "+a[1].q+")</option>"}).join("")}
function openAdd(x){AX=O[x].k;var v=document.createElement("div");v.id="ao";v.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center";
v.innerHTML='<div class="box" style="width:100%;max-width:520px;margin:0;border-radius:14px 14px 0 0;max-height:88vh;overflow:auto"><b>إضافة صنف للطلب</b><div class="m"><label><input type="radio" name="am" value="c" checked> من أصنافي</label><label><input type="radio" name="am" value="n"> صنف جديد</label></div><div id="ac"><input class="w" id="aq" placeholder="ابحث باسم الصنف"><select id="as" size="6" style="width:100%;margin-top:6px"></select></div><div id="an" hidden><input class="w" id="nn" placeholder="اسم الصنف"><input class="w" id="nb" placeholder="الشركة" style="margin-top:6px"><div class="m"><input type="number" id="np" placeholder="سعر القطعة على القايمة" style="width:48%"><input type="number" id="nc" placeholder="سعر شرائك (اختياري)" style="width:48%"></div><label class="m"><span><input type="checkbox" id="nd" style="width:auto"> بدون خصم (السعر نهائي)</span></label></div><div class="m"><label>الكمية <input type="number" id="aqty" value="1" min="1"></label><span><button class="b x" data-ax="1">إلغاء</button> <button class="b" data-ag="1">إضافة</button></span></div></div>';
document.body.appendChild(v);fill()}
function closeAdd(){var v=$("ao");if(v)v.remove()}
async function addgo(){var n=document.querySelector("input[name=am]:checked").value==="n",b={k:AX,q:+$("aqty").value};
if(n){b.n=$("nn").value.trim();b.b=$("nb").value.trim();b.p=+$("np").value;b.c=+$("nc").value;b.nd=$("nd").checked;if(!b.n)return alert("اكتب اسم الصنف");if(!(b.p>0))return alert("اكتب سعر البيع")}
else{b.i=$("as").value;if(b.i==="")return alert("اختار صنف من القايمة")}
await api("add",b);closeAdd();await reopen(AX)}
document.addEventListener("change",function(e){if(e.target.name==="am"){var n=e.target.value==="n";$("ac").hidden=n;$("an").hidden=!n}});
async function det(x){var d=$("d"+x);if(d.innerHTML){d.innerHTML="";return}
var o=await api("order?k="+encodeURIComponent(O[x].k)),ph=o.phone.replace(/^0/,"20"),L=o.items.reduce(function(t,l){return t+l[1]*l[2]},0),X=(o.extra||[]).reduce(function(t,e){return t+e.q*e.p},0),ef=o.disc!=null?o.disc:(L?Math.round((1-(o.total-X)/L)*100):0);
d.innerHTML='<div class="det">'+o.items.map(function(l,n){return"• "+esc(C.items[l[0]].n)+" × "+l[1]+' <button class="b x" style="padding:1px 8px" data-rm="'+x+":i:"+n+'">✕</button>'}).join("<br>")+(o.extra||[]).map(function(e,n){return"<br>• "+esc(e.n)+(e.b?" ("+esc(e.b)+")":"")+" × "+e.q+" بسعر قايمة "+f(e.p)+(e.nd?" (بدون خصم)":"")+' ج [جديد] <button class="b x" style="padding:1px 8px" data-rm="'+x+":e:"+n+'">✕</button>'}).join("")+'<br>إجمالي القايمة: '+f(L)+' ج<br>خصم % <input type="number" id="dd'+x+'" value="'+ef+'" style="width:70px"> <button class="b" data-ap="'+x+'">طبّق</button> ← الإجمالي '+f(o.total)+' ج<br>التوصيل: '+f(o.fee)+' ج ('+esc(o.zone)+')<br>الموبايل: <a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a> · <a href="https://wa.me/'+esc(ph)+'">واتساب</a><br>العنوان: '+esc(o.addr)+(o.loc?' · <a href="https://maps.google.com/?q='+esc(o.loc)+'">الخريطة</a>':"")+(o.note?"<br>ملاحظات: "+esc(o.note):"")+'<div class="m"><button class="b" data-add="'+x+'">➕ إضافة صنف</button><button class="b" data-inv="'+x+'">🧾 فاتورة</button><button class="b x" data-del="'+x+'">مسح الطلب</button></div></div>'}
document.addEventListener("click",async function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
try{if(d.t){if(dirty&&!confirm("فيه تعديلات ما اتحفظتش، تكمّل؟"))return;tab=d.t;await load()}
else if(d.d!==undefined)await det(+d.d);
else if(d.ap!==undefined){await api("discount",{k:O[+d.ap].k,d:+$("dd"+d.ap).value});await load();alert("اتطبّق ✓")}
else if(d.add!==undefined)openAdd(+d.add);
else if(d.ag!==undefined)await addgo();
else if(d.ax!==undefined)closeAdd();
else if(d.rm){if(confirm("تشيل الصنف ده من الطلب؟")){var s=d.rm.split(":"),k0=O[+s[0]].k;await api("rm",{k:k0,t:s[1],x:+s[2]});await reopen(k0)}}
else if(d.inv!==undefined)await inv(+d.inv);
else if(d.del!==undefined){if(confirm("تمسح الطلب ده؟ لو كان مؤكد أو متسلّم فلوسه بتفضل محسوبة في الملخص، والستوك مش هيرجع."))await del([O[+d.del].k])}
else if(d.bulk){var ks=O.filter(function(o){return o.s==="delivered"||o.s==="cancelled"}).map(function(o){return o.k});if(confirm("تمسح "+ks.length+" طلب (المتسلّمة والملغية)؟ اعمل فواتيرهم الأول لو محتاجها. الأرباح بتفضل محسوبة."))await del(ks)}
else if(d.s){await api("status",{k:O[+d.i].k,s:d.s});await load()}
else if(b.id==="save"){await api("cfg",C);dirty=false;await load();alert("اتحفظ ✓")}}
catch(x){if(x&&x.e==="stock")alert("الستوك مش كفاية: "+x.n);else if(x)alert("حصل خطأ: "+(x.e||x))}});
document.addEventListener("input",function(e){var d=e.target.dataset,v=e.target.value;
if(d.q!==undefined)C.items[+d.q].q=Math.max(0,Math.floor(+v||0));
else if(d.l!==undefined)C.items[+d.l].l=Math.max(0,+v||0);
else if(d.f!==undefined)C.fees[+d.f]=Math.max(0,+v||0);
else if(e.target.id==="dc")C.disc=Math.min(90,Math.max(0,+v||0));
else if(e.target.id==="aq"){fill();return}
else if(e.target.id==="sh")C.shop=v;
else if(e.target.id==="wa")C.wa=v.replace(/\D/g,"");else return;
dirty=true;if($("ds"))$("ds").textContent="فيه تعديلات لسه ما اتحفظتش"});
if(PW)load();else login("");
</script></body></html>
